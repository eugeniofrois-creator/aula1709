<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Minha Página</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            /* Imagem utilizada como fundo da página */
            background-image: url("Imagens/aranha_5.jpg");

            /* Faz a imagem preencher toda a página */
            background-size: cover;

            /* Centraliza a imagem */
            background-position: center;

            /* Impede a repetição da imagem */
            background-repeat: no-repeat;
        }

        h1 {
            /* Centraliza o título */
            text-align: center;

            /* Define a cor do título */
            color: white;

            /* Cria um espaço acima do título */
            padding-top: 50px;
        }

        .texto-centro {
            /* Coloca o texto no centro da página */
            position: absolute;

            /* Posiciona o texto a 50% da esquerda */
            left: 50%;

            /* Ajusta o elemento para ficar exatamente no centro */
            transform: translate(-50%, 50%);

            /* Centraliza as linhas do texto */
            text-align: center;

            /* Define a cor do texto */
            color: rgba(240, 240, 240, 0.849);

            /* Define o tamanho do texto */
            font-size: 22px;

            /* Coloca um fundo preto transparente */
            background-color: rgba(0, 0, 0, 0.1);

            /* Cria um espaço interno */
            padding: 20px;

            /* Arredonda os cantos */
            border-radius: 10px;
        }

        button {
            
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

        }
    </style>
</head>

<body>

    <h1>Bem-vindo à minha página!</h1>

    <div class="texto-centro">
        <p>
            A tecnologia está presente em diferentes momentos da nossa vida.
            Por meio da programação, podemos desenvolver páginas, sistemas
            e soluções para diferentes necessidades.
        </p>
    </div>
   
</body>
<center>

<a href="index.html"><button>Voltar</button></a>

</center>
</html>
